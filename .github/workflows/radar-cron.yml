name: RADAR pipeline
# Runs the whole loop once, on demand (Actions → RADAR pipeline → Run workflow). The 6-hour loop itself runs on
# Vercel Cron (vercel.json: every route four times a day), so this is the manual trigger and the fallback:
#   discover  → StartupMap (48h cadence, resumes each run) + your imports → their ATS boards
#   cron      → scrape every tracked feed and your job-alert emails → match → verified 80%+ into the Vault
#   autopilot → re-check open postings, Gmail replies, auto-OVERCLOCK
# Needs repo secrets: RADAR_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger discover → cron → autopilot
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RADAR_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set RADAR_URL and CRON_SECRET repo secrets to enable the schedule."; exit 0
          fi
          failed=0
          for route in api/cron/discover api/cron api/cron/autopilot; do
            status=$(curl -sS -o response.json -w '%{http_code}' --max-time 320 \
              -H "Authorization: Bearer $CRON_SECRET" "$RADAR_URL/$route?trigger=github-actions")
            echo "== /$route → HTTP $status"; head -c 3000 response.json; echo
            [ "$status" = "200" ] || failed=1
          done
          exit $failed
